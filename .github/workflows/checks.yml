name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: python -m pip install tzdata==2025.2
      - run: python -B scripts/test_watch_storyboards.py
      - run: python -B scripts/test_google_vdp.py
